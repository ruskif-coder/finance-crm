# Статический анализ бэкенда. До 2026-08-22 его не было вообще.
#
# Набор правил выбран по замеру на живом коде, а не по умолчанию «включить всё»:
# полный прогон даёт 1900 замечаний, и линтер, который сразу красный, никто не читает.
#
#   F   (pyflakes)     22 замечания — неиспользованные импорты, пустые f-строки,
#                      переменная, затирающая импорт, мёртвая переменная. Всё реальное.
#   E9  (синтаксис)     0 — но пусть стоит: это уже не стиль, а сломанный файл.
#
# Осознанно НЕ включено, с числами:
#   E501 line-too-long          1818 — в этом коде длинные строки намеренные
#                                      (словари колонок Excel, SQL-строки).
#   E402 import-not-at-top        17 — локальные импорты стоят внутри функций, чтобы
#                                      разорвать циклический импорт (см. auth.py, CLAUDE.md).
#   E702 точка с запятой          32 — компактный стиль однострочников, принят в проекте.
#   E741 ambiguous-name           21 — переменные l/I/O, косметика.
#   B008 function-call-in-default 706 — это и есть Depends(...) в сигнатуре FastAPI.
#   B023 loop-variable-in-closure  4 — проверено вручную: все четыре замыкания
#                                      вызываются внутри той же итерации, ложные срабатывания.
#
# Расширять набор — отдельным решением и вместе с расчисткой того, что он покажет.

line-length = 120
target-version = "py311"
exclude = [".venv", "__pycache__"]

[lint]
select = ["F", "E9"]
