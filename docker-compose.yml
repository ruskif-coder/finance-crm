# Версии образов ЗАКРЕПЛЕНЫ. `latest` и major-only означают, что следующая пересборка
# может принести другой образ — и узнаем мы об этом по поведению, а не по решению.
# Особенно это касается Timescale: там политики и API continuous aggregate меняются
# между минорными, а на них держится суточный срез. Значения — те, что реально крутятся
# на 11.09.2026 (замер: postgres 16.14, timescaledb 2.29.2, caddy 2.11.4).
# Обновление версии — отдельная осознанная правка, а не побочный эффект `up --build`.

services:
  db:
    image: postgres:16.14
    container_name: finance_db
    restart: always
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Раньше было "5432:5432" — слушало на всех интерфейсах хоста, то есть Postgres был
    # достижим из локальной сети/интернета при открытом файрволе, хотя снаружи контейнера
    # к нему никто кроме backend не должен ходить (он общается с db через внутреннюю сеть
    # docker-compose по имени "db"). 127.0.0.1 оставляет доступ только с этой машины
    # (psql/pgAdmin локально), убирает внешнюю поверхность атаки.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  # Аналитическая база DSP (контур «DSP-коннектор», этап 2a, 02.09.2026): TimescaleDB на pg16.
  # Своя база — сырьё stat-API DSP, журнал отправок, курсоры; в основную (db) уходит
  # только суточный срез (ad_campaign_stat). Порт только на 127.0.0.1. Схема —
  # backend/migrations/dsp/2026-09-02_dsp_analytics.sql (накат: docker exec -i finance_dsp_db psql).
  dsp_analytics_db:
    image: timescale/timescaledb:2.29.2-pg16
    container_name: finance_dsp_db
    # Без этой строки сервис не переживает перезапуск докера — и был единственным таким
    # из восьми (найдено 07.09.2026: контейнер лежал три часа, а соседние поднялись сами).
    # Коннектор при этом молчит, а не падает, поэтому пропажу видно не сразу.
    restart: always
    environment:
      POSTGRES_DB: dsp_analytics
      POSTGRES_USER: dsp
      POSTGRES_PASSWORD: ${DSP_DB_PASSWORD}
    volumes:
      - dsp_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsp -d dsp_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  backend:
    build: ./backend
    container_name: finance_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finance_user:${POSTGRES_PASSWORD}@db:5432/finance
      DSP_DATABASE_URL: postgresql://dsp:${DSP_DB_PASSWORD}@dsp_analytics_db:5432/dsp_analytics
      SECRET_KEY: ${SECRET_KEY}
      # Используется в main.py для CORS allow_origins — см. комментарий там.
      # Пока не открыли систему наружу, оставляйте "localhost".
      DOMAIN: ${DOMAIN:-localhost}
      # Сайдкар генерации нативного PDF (headless Chromium). Только внутренняя сеть.
      PDF_SERVICE_URL: http://pdf:3001
      # Ключ доступа к Битриксу через VibeCode (синк сделок). Значение — в .env
      # (gitignored), сюда только ссылка. Раньше ключ клали файлом /app/vibecode.key
      # внутрь ЖИВОГО контейнера через docker cp — он терялся при каждом
      # up --force-recreate / пересборке. Через env переживает пересоздание.
      VIBECODE_API_KEY: ${VIBECODE_API_KEY:-}
      # Прямой вебхук Битрикса — второй путь к тому же порталу, мимо VibeCode.
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      # Телеграм-бот уведомлений. Пустой токен = доставки нет: отправки ложатся в журнал
      # статусом queued и человеку не показываются. Молча — поэтому переменные и должны
      # быть перечислены здесь, а не только в .env.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Доступ к API ОРД МедиаСкаут. Значения — в .env (gitignored), сюда только ссылки.
      # Контур ПО УМОЛЧАНИЮ demo: забытая переменная должна отправлять в песочницу, а не
      # в ЕРИР — регистрация маркера необратима. prod ставится осознанно.
      ORD_ENV: ${ORD_ENV:-demo}
      # Домен песочницы: бэкенд отдаёт готовый адрес баннера, а знает его окружение.
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-https://sb.localhost}
      ORD_LOGIN: ${ORD_LOGIN:-}
      ORD_PASSWORD: ${ORD_PASSWORD:-}
      # Пропуск процесса кабинета в ядро. ПУСТОЙ секрет закрывает вход насовсем —
      # забытая переменная должна ломать функцию, а не защиту.
      CABINET_SERVICE_TOKEN: ${CABINET_SERVICE_TOKEN:-}
      # Доступ к DSP. Значения — в .env (gitignored), сюда только ссылки.
      #
      # Проброс обязателен ИМЕННО ЗДЕСЬ: `app/dsp/client.py` читает их из окружения
      # процесса, а `.env` наполняет не контейнер, а сам compose. Без этих строк токен,
      # положенный в `.env` на сервере, до бэкенда не доходит вовсе — и коннектор
      # отвечает «не заданы в окружении», что со стороны неотличимо от неверного токена.
      DSP_API_URL: ${DSP_API_URL:-}
      DSP_ACCESS_TOKEN: ${DSP_ACCESS_TOKEN:-}
      DSP_PARTNER_XXHASH: ${DSP_PARTNER_XXHASH:-}
      # Демо-контур того же DSP — отдельный кабинет и отдельный токен. Разделены, чтобы
      # прогон на демо-стенде не попадал в дедуп боевых отправок (контур пишется в журнал).
      DSP_DEMO_API_URL: ${DSP_DEMO_API_URL:-}
      DSP_DEMO_TOKEN: ${DSP_DEMO_TOKEN:-}
      DSP_DEMO_PARTNER_XXHASH: ${DSP_DEMO_PARTNER_XXHASH:-}
      # Верификатор Weborama (WCM): её пиксель обязателен для ротации креатива в DSP.
      # Авторизация двухслойная — сначала JWT по email и паролю, потом два заголовка на
      # каждый вызов. `account_id` СЮДА НЕ КЛАДЁМ: аккаунты Weborama выдаёт списком и
      # закрепляет за клиентами, и брать его из окружения значило бы однажды записать
      # кампанию одного рекламодателя в измерения другого.
      WEBORAMA_API_URL: ${WEBORAMA_API_URL:-}
      WEBORAMA_EMAIL: ${WEBORAMA_EMAIL:-}
      WEBORAMA_PASSWORD: ${WEBORAMA_PASSWORD:-}
      # Только ПОДСТАВЛЯЕТ номер аккаунта в поле демо-стенда. Клиент его не берёт:
      # выбор аккаунта всегда делает человек и всегда его видит.
      WEBORAMA_DEMO_ACCOUNT_ID: ${WEBORAMA_DEMO_ACCOUNT_ID:-}
      #
      # ORD_ALLOW_PROD_WRITE, DEBUG и LOG_DIR код читает, а здесь их НЕТ — намеренно, и
      # у каждой своя причина. Они записаны рядом с именем в
      # backend/tests/test_env_passthrough.py, который и следит, чтобы этот список не
      # разошёлся с тем, что читает код: та же дыра уже трижды тихо ломала функции.
    volumes:
      - ./backend/logs:/app/logs
      - ./uploads:/app/uploads   # персистентное хранилище прикреплённых файлов договоров
      # Каталог бэкапов — ТОЛЬКО НА ЧТЕНИЕ. Без него проверка свежести на экране
      # состояния отдаёт «нет доступа», а пороги 26/48 ч не срабатывают никогда: умерший
      # cron и пустые дампы не попадают в оповещения (F3-09 внешнего аудита 11.09.2026).
      #
      # Источник задаётся переменной: на проде каталогов исторически несколько — ручной
      # из `deploy.sh` и автоматический из сервиса бэкапов, — и смонтировать не тот
      # значит смотреть на чужие старые файлы и считать их свежими. `BACKUPS_DIR` в .env
      # выбирает ТОТ ЖЕ каталог, куда пишет `deploy.sh backup`; имя самого свежего файла
      # видно в подписи проверки, так что ошибку монтажа видно с экрана.
      - ${BACKUPS_DIR:-./backups}:/app/backups:ro
    # Проверка живости. Её не было ни у одного приложения — только у двух баз, и
    # «контейнер up» означало лишь «процесс не вышел»: зависший uvicorn или Next,
    # отдающий 500 на всё, выглядели здоровыми. Инструмент внутри образа выбран по
    # факту: в python-образах нет ни curl, ни wget, в node-образах нет python
    # (замер 11.09.2026).
    # `depends_on: service_healthy` НЕ добавляем — это изменило бы порядок старта всего
    # контура; здесь только видимость состояния.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    # См. комментарий у db.ports — то же рассуждение: прямой доступ снаружи этой машины
    # не нужен, единственная публичная точка входа — caddy (80/443).
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m

  frontend:
    build: ./frontend
    container_name: finance_frontend
    restart: always
    depends_on:
      - backend
    # См. комментарий у db.ports.
    ports:
      - "127.0.0.1:3000:3000"
    # Проверка живости — см. комментарий у backend.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    mem_limit: 512m

  # ── Кабинет паблишера: ОТДЕЛЬНЫЙ контур ────────────────────────────────────────
  #
  # Отдельные процессы, а не второй роутер внутри финансового бэкенда, и причина одна:
  # ОДИН ПРОЦЕСС ДЕРЖИТ ОДИН ПУЛ СОЕДИНЕНИЙ ПОД ОДНОЙ РОЛЬЮ. Роутер внутри ядра ходил бы
  # под `finance_user`, который видит все 78 таблиц, — и схема `pub` с view вместо
  # таблиц не давала бы ничего. Вся изоляция держится на том, под какой ролью открыто
  # соединение (миграция 2026-08-28_publisher_cabinet.sql).
  cabinet_backend:
    build: ./cabinet
    container_name: cabinet_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Роль `cabinet` без USAGE на схему `public`: таблица, которую заведёт create_all
      # ядра, для этого процесса физически невидима.
      CABINET_DATABASE_URL: postgresql://cabinet:${CABINET_DB_PASSWORD}@db:5432/finance
      # СВОЙ ключ подписи. С общим ключом токен, выписанный кабинетом внешнему лицу,
      # был бы валиден и для финмодуля.
      CABINET_SECRET_KEY: ${CABINET_SECRET_KEY}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-https://sb.localhost}
      # Кабинет не пишет в базу — он зовёт ядро по внутренней сети этим секретом.
      CABINET_SERVICE_TOKEN: ${CABINET_SERVICE_TOKEN:-}
      CORE_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:8001:8001"
    # Проверка живости — см. комментарий у backend.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    mem_limit: 512m

  cabinet_frontend:
    build: ./cabinet-frontend
    container_name: cabinet_frontend
    restart: always
    depends_on:
      - cabinet_backend
    ports:
      - "127.0.0.1:3001:3000"
    # Проверка живости — см. комментарий у backend.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    mem_limit: 512m

  # PDF-сайдкар: headless Chromium (Playwright) рендерит страницу медиаплана в нативный
  # PDF. Портов наружу нет — ходит только backend по внутренней сети (http://pdf:3001).
  pdf:
    build: ./pdf-service
    container_name: finance_pdf
    restart: always
    depends_on:
      - frontend
    environment:
      FRONTEND_URL: http://frontend:3000
    # Проверка живости — см. комментарий у backend.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    mem_limit: 1024m

  # Reverse proxy: единственный сервис, слушающий на всех интерфейсах (0.0.0.0:80/443).
  # Маршрутизация — см. ./Caddyfile. DOMAIN=localhost (значение по умолчанию из .env) —
  # Caddy в этом случае не пытается получить сертификат Let's Encrypt (это публичный CA,
  # ему нужен реальный домен, прошедший HTTP-01 challenge снаружи) и обслуживает запросы
  # по локально доверенному сертификату — для повседневной локальной работы это нормально,
  # в браузере просто нужно принять предупреждение один раз (или использовать http://localhost,
  # Caddy сам не форсирует https для локального имени). Подставьте реальный домен в .env
  # (DOMAIN=ваш-домен) только после того как DNS A-запись и проброс портов 80/443 настроены —
  # см. DEPLOYMENT.md.
  caddy:
    image: caddy:2.11.4
    container_name: finance_caddy
    restart: always
    depends_on:
      - backend
      - frontend
      - cabinet_backend
      - cabinet_frontend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Кабинет паблишера — свой поддомен. Локально `lk.localhost` работает без правки
      # hosts: *.localhost браузеры резолвят сами. На проде — `lk.simb-ad.com`.
      CABINET_SITE: ${CABINET_SITE:-lk.localhost}
      # Песочница: свой домен и список тех, кому позволено её встраивать. По умолчанию
      # локальные значения — на проде оба задаются в .env вместе с DNS-записью.
      SANDBOX_SITE: ${SANDBOX_SITE:-sb.localhost}
      SANDBOX_FRAME_ANCESTORS: ${SANDBOX_FRAME_ANCESTORS:-http://localhost https://localhost}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-https://sb.localhost}
    ports:
      - "80:80"
      - "443:443"
    # ПРОД: caddy ДОПОЛНИТЕЛЬНО присоединяется к внешней сети `caddy_proxy` (общая с
    # TruckCRM) — иначе pm.simbad.pro отдаёт 502. Здесь этого НЕТ намеренно: локально сети
    # нет, объявление `external` сломало бы `up`. При слиянии прод-compose добавить
    # `networks: [default, caddy_proxy]` сюда и top-level `networks: {caddy_proxy: external}`.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Распакованные баннеры — только на чтение: Caddy их раздаёт, писать туда
      # имеет право лишь бэкенд при загрузке.
      - ./uploads/sandbox:/srv/sandbox:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  dsp_data:
  caddy_data:
  caddy_config: